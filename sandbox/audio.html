<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xeno-Racer audio bench</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --bg: #0b0c10; --panel: #14161d; --line: #262a35; --fg: #eef0f3; --dim: #8b92a3; --teal: #16e0bd; --pink: #ff2e63; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, 'Segoe UI', sans-serif; }
      #out { padding: 16px; white-space: pre-wrap; }
      #app { display: none; padding: 14px 18px 40px; max-width: 1500px; margin: 0 auto; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 12px; }
      h1 { margin: 0; font-size: 20px; letter-spacing: 0.04em; }
      h1::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--teal); margin-right: 10px; box-shadow: 0 0 10px var(--teal); }
      h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--teal); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
      .panel.wide { margin-top: 12px; }
      .row { display: grid; grid-template-columns: 150px 1fr 64px; align-items: center; gap: 8px; margin: 5px 0; color: var(--dim); }
      .row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row.chk { grid-template-columns: 22px 1fr; }
      .row select { grid-column: span 2; }
      output { text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; }
      input[type='range'] { width: 100%; accent-color: var(--teal); }
      select, button { background: #1c1f29; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; }
      button { cursor: pointer; }
      button:hover { border-color: var(--teal); }
      button:disabled { opacity: 0.5; cursor: wait; }
      button.start { background: var(--pink); border-color: var(--pink); font-weight: 600; padding: 9px 16px; }
      .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
      .hint { margin: 8px 0 0; color: var(--dim); font-size: 12px; }
      .status { color: var(--dim); font-variant-numeric: tabular-nums; }
      .viz { width: 100%; height: auto; display: block; border-radius: 6px; background: #000; }
      pre.readout, pre.testout { margin: 8px 0 0; color: var(--fg); font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
      pre.testout { max-height: 260px; overflow: auto; color: var(--dim); }
      @media (max-width: 600px) { .row { grid-template-columns: 110px 1fr 56px; } }
    </style>
  </head>
  <body>
    <pre id="out">loading audio sandbox…</pre>
    <div id="app"></div>
    <script type="module" src="./audio/main.ts"></script>
  </body>
</html>
