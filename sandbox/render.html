<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xeno-Racer — render sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; font-family: system-ui, sans-serif; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <script>
      /* Under automation (Playwright sets navigator.webdriver) never let Vite's HMR socket reload the page:
         the dev server's file watcher also sees writes to shots/*.png, which would reload this page in the
         middle of a screenshot. */
      if (navigator.webdriver) {
        const NativeWS = window.WebSocket;
        const Stub = function (url, protocols) {
          const isHmr = protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') >= 0);
          if (!isHmr) return new NativeWS(url, protocols);
          return { readyState: 0, addEventListener() {}, removeEventListener() {}, send() {}, close() {}, dispatchEvent() { return true; } };
        };
        Stub.prototype = NativeWS.prototype;
        Stub.CONNECTING = 0; Stub.OPEN = 1; Stub.CLOSING = 2; Stub.CLOSED = 3;
        window.WebSocket = Stub;
      }
    </script>
    <canvas id="game"></canvas>
    <script type="module" src="/sandbox/render/main.ts"></script>
  </body>
</html>
